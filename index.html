<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모비데이즈 용어집</title>
<style>
:root {
  --bg: #f4f5f9;
  --card: #fff;
  --border: #e4e7f0;
  --primary: #1c1c3a;
  --accent: #4f46e5;
  --accent-light: #ede9fe;
  --accent-hover: #4338ca;
  --text: #1e1e2e;
  --muted: #6b7280;
  --tag-bg: #f0f1fc;
  --tag-color: #4f46e5;
  --essential-bg: #fff1f2;
  --essential-color: #e11d48;
  --recommended-bg: #f0fdf4;
  --recommended-color: #16a34a;
  --sidebar-w: 210px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

header{background:linear-gradient(135deg,#1c1c3a 0%,#312e81 100%);color:#fff;padding:28px 24px 24px}
.header-inner{max-width:1300px;margin:0 auto}
header h1{font-size:1.7rem;font-weight:800;letter-spacing:-0.3px}
header p{margin-top:5px;font-size:.875rem;opacity:.7}
.tabs{display:flex;gap:8px;margin-top:20px}
.tab-btn{padding:8px 20px;border-radius:999px;border:none;cursor:pointer;font-size:.875rem;font-weight:600;transition:all .15s;background:rgba(255,255,255,.12);color:rgba(255,255,255,.8)}
.tab-btn.active{background:#fff;color:var(--accent)}

.container{max-width:1300px;margin:0 auto;padding:24px 20px 60px}
.layout{display:flex;gap:20px;align-items:flex-start}

.sidebar{width:var(--sidebar-w);flex-shrink:0;position:sticky;top:20px;background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden}
.sidebar-title{padding:12px 14px;font-size:.72rem;font-weight:700;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);background:#fafbff}
.sidebar ul{list-style:none;padding:6px 0}
.sidebar li button{width:100%;text-align:left;background:none;border:none;padding:8px 14px;font-size:.825rem;cursor:pointer;color:var(--text);display:flex;justify-content:space-between;align-items:center;transition:background .12s;line-height:1.35;gap:6px}
.sidebar li button:hover{background:var(--tag-bg)}
.sidebar li button.active{background:var(--accent);color:#fff;font-weight:700}
.sidebar li button.active .badge-count{background:rgba(255,255,255,.25);color:#fff}
.badge-count{font-size:.68rem;background:var(--tag-bg);color:var(--tag-color);border-radius:999px;padding:2px 6px;font-weight:600;flex-shrink:0}

#browseTab{display:block}
#studyTab{display:none}

.search-wrap{position:relative;margin-bottom:16px}
.search-wrap input{width:100%;padding:12px 44px 12px 16px;border-radius:12px;border:1.5px solid var(--border);font-size:.9rem;outline:none;background:#fff;transition:border .15s}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap .ico{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.clear-x{position:absolute;right:38px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;display:none}

.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:5px 14px;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s}
.filter-btn.active-all{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-btn.active-essential{background:var(--essential-bg);color:var(--essential-color);border-color:var(--essential-color)}
.filter-btn.active-recommended{background:var(--recommended-bg);color:var(--recommended-color);border-color:var(--recommended-color)}

.stats{font-size:.82rem;color:var(--muted);margin-bottom:14px}
.stats strong{color:var(--accent)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px 18px;transition:box-shadow .15s,transform .1s}
.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-1px)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.term{font-size:1rem;font-weight:800;color:var(--primary);line-height:1.25;word-break:break-word}
.priority-badge{font-size:.65rem;font-weight:700;border-radius:5px;padding:2px 7px;flex-shrink:0;margin-top:1px}
.priority-badge.essential{background:var(--essential-bg);color:var(--essential-color)}
.priority-badge.recommended{background:var(--recommended-bg);color:var(--recommended-color)}
.sub-badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.sub-badge{font-size:.72rem;border-radius:6px;padding:2px 8px}
.sub-badge.kr{background:#f0f4ff;color:#3b4cc0}
.sub-badge.en{background:#fff3e0;color:#b35000}
.desc{font-size:.845rem;color:#3a3a4a;line-height:1.65;white-space:pre-line}
.note-text{margin-top:7px;font-size:.76rem;color:var(--muted);border-left:3px solid var(--border);padding-left:8px;white-space:pre-line}
mark{background:#fde68a;color:inherit;border-radius:2px;padding:0 1px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:2.5rem;margin-bottom:10px}

/* ── Study Tab ── */
.study-container{max-width:680px;margin:0 auto;padding:0 0 60px}
.study-setup{background:var(--card);border-radius:16px;border:1px solid var(--border);padding:28px}
.study-setup h2{font-size:1.2rem;font-weight:800;margin-bottom:6px}
.study-setup p{font-size:.875rem;color:var(--muted);margin-bottom:20px}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.mode-card{border:2px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:all .15s;background:#fff;text-align:left}
.mode-card:hover,.mode-card.selected{border-color:var(--accent);background:var(--accent-light)}
.mode-card .mode-icon{font-size:1.5rem;margin-bottom:6px}
.mode-card .mode-title{font-size:.9rem;font-weight:700;margin-bottom:3px}
.mode-card .mode-desc{font-size:.78rem;color:var(--muted)}
.mode-card.selected .mode-desc{color:var(--accent)}
.cat-selector{margin-bottom:20px}
.cat-selector label{display:block;font-size:.82rem;font-weight:600;margin-bottom:8px;color:var(--muted)}
.cat-checkboxes{display:flex;flex-wrap:wrap;gap:8px}
.cat-check{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--border);cursor:pointer;font-size:.8rem;font-weight:600;transition:all .12s;background:#fff;user-select:none}
.cat-check input{display:none}
.cat-check.checked{background:var(--accent);color:#fff;border-color:var(--accent)}
.start-btn{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:background .15s}
.start-btn:hover{background:var(--accent-hover)}

/* Progress */
.study-progress{text-align:center;font-size:.82rem;color:var(--muted);margin-bottom:12px}
.progress-bar-wrap{height:5px;background:var(--border);border-radius:999px;margin-bottom:24px;overflow:hidden}
.progress-bar{height:100%;background:var(--accent);border-radius:999px;transition:width .3s}

/* ── Flashcard (설명→용어) ── */
.flashcard-wrap{display:none}

.fc-card{
  background:var(--card);border-radius:20px;border:1.5px solid var(--border);
  padding:32px;min-height:260px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,.06);margin-bottom:16px;
}
.fc-label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;font-weight:600}
.fc-desc-text{font-size:.95rem;color:#3a3a4a;line-height:1.75;white-space:pre-line;max-width:520px}
.fc-sub-text{margin-top:8px;font-size:.78rem;color:var(--muted)}

/* Term reveal box */
.fc-reveal-wrap{margin-top:20px;width:100%}
.fc-reveal-btn{
  width:100%;padding:13px;border-radius:12px;border:2px dashed var(--border);
  background:var(--bg);font-size:.9rem;font-weight:600;color:var(--muted);
  cursor:pointer;transition:all .2s;
}
.fc-reveal-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.fc-answer-box{
  width:100%;padding:16px;border-radius:12px;background:var(--accent-light);
  border:2px solid var(--accent);text-align:center;display:none;
}
.fc-answer-term{font-size:1.3rem;font-weight:800;color:var(--accent);margin-bottom:4px}
.fc-answer-sub{font-size:.78rem;color:var(--muted)}

.fc-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px}
.fc-nav button{padding:10px 22px;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-size:.875rem;font-weight:600;cursor:pointer;transition:all .15s;color:var(--text)}
.fc-nav button:hover{background:var(--tag-bg)}
.fc-nav button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.fc-nav button.primary:hover{background:var(--accent-hover)}

/* ── Quiz ── */
.quiz-wrap{display:none}
.quiz-card-box{background:var(--card);border-radius:16px;border:1.5px solid var(--border);padding:28px;margin-bottom:16px}
.quiz-q-label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;font-weight:600}
.quiz-desc-box{font-size:.9rem;color:#3a3a4a;line-height:1.7;white-space:pre-line;margin-bottom:18px;background:var(--bg);border-radius:10px;padding:14px}
.quiz-input{width:100%;padding:12px 16px;border-radius:10px;border:1.5px solid var(--border);font-size:.95rem;outline:none;transition:border .15s}
.quiz-input:focus{border-color:var(--accent)}
.quiz-check-btn{margin-top:10px;padding:10px 24px;background:var(--accent);color:#fff;border:none;border-radius:999px;font-size:.875rem;font-weight:700;cursor:pointer;transition:background .15s}
.quiz-check-btn:hover{background:var(--accent-hover)}
.quiz-result{margin-top:12px;padding:12px 16px;border-radius:10px;font-size:.875rem;font-weight:600;display:none}
.quiz-result.correct{background:#f0fdf4;color:#16a34a;border:1.5px solid #86efac}
.quiz-result.wrong{background:#fff1f2;color:#e11d48;border:1.5px solid #fca5a5}

.quiz-score{background:var(--card);border-radius:16px;border:1.5px solid var(--border);padding:40px;text-align:center;display:none}
.score-num{font-size:3rem;font-weight:800;color:var(--accent);margin-bottom:8px}
.score-sub{font-size:.95rem;color:var(--muted);margin-bottom:24px}

.study-back-btn{width:100%;padding:12px;background:none;border:1.5px solid var(--border);border-radius:12px;font-size:.875rem;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s;margin-top:8px}
.study-back-btn:hover{border-color:var(--accent);color:var(--accent)}

@media(max-width:768px){
  .layout{flex-direction:column}
  .sidebar{width:100%;position:static}
  .cards{grid-template-columns:1fr}
  .mode-cards{grid-template-columns:1fr}
  header h1{font-size:1.3rem}
}
</style>
</head>
<body>

<header>
<div class="header-inner">
  <h1>📖 모비데이즈 용어집</h1>
  <p>신입/인턴을 위한 내부 용어 가이드 — 342개 용어</p>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('browse')">🔍 용어 찾기</button>
    <button class="tab-btn" onclick="switchTab('study')">🧠 학습 모드</button>
  </div>
</div>
</header>

<div class="container">

<!-- ── BROWSE TAB ── -->
<div id="browseTab">
<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-title">카테고리</div>
    <ul id="catList"></ul>
  </nav>
  <div style="flex:1;min-width:0">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="용어, 설명, 영어 키워드 검색..." autocomplete="off">
      <button class="clear-x" id="clearBtn">✕</button>
      <span class="ico">🔍</span>
    </div>
    <div class="filter-row">
      <button class="filter-btn active-all" onclick="setPriority('')">전체</button>
      <button class="filter-btn" onclick="setPriority('필수')">⭐ 필수</button>
      <button class="filter-btn" onclick="setPriority('권장')">📚 권장</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="cards" id="cardGrid"></div>
    <div class="empty" id="emptyState" style="display:none">
      <div class="empty-icon">🔎</div>
      <div>검색 결과가 없어요</div>
    </div>
  </div>
</div>
</div>

<!-- ── STUDY TAB ── -->
<div id="studyTab">
<div class="study-container">

  <div class="study-setup" id="studySetup">
    <h2>🧠 학습 모드</h2>
    <p>학습할 모드와 카테고리를 선택하세요.</p>
    <div class="mode-cards">
      <button class="mode-card selected" id="modeFlash" onclick="selectMode('flash')">
        <div class="mode-icon">🃏</div>
        <div class="mode-title">플래시카드</div>
        <div class="mode-desc">설명을 보고 용어를 떠올린 뒤 확인</div>
      </button>
      <button class="mode-card" id="modeQuiz" onclick="selectMode('quiz')">
        <div class="mode-icon">✏️</div>
        <div class="mode-title">빈칸 퀴즈</div>
        <div class="mode-desc">설명을 보고 용어를 직접 입력</div>
      </button>
    </div>
    <div class="cat-selector">
      <label>카테고리 선택</label>
      <div class="cat-checkboxes" id="catCheckboxes"></div>
    </div>
    <div style="margin-bottom:16px">
      <label style="font-size:.82rem;font-weight:600;color:var(--muted);display:block;margin-bottom:8px">우선순위 필터</label>
      <div style="display:flex;gap:8px">
        <button class="filter-btn active-all" id="studyPrioAll" onclick="setStudyPrio('')">전체</button>
        <button class="filter-btn" id="studyPrioEss" onclick="setStudyPrio('필수')">⭐ 필수만</button>
        <button class="filter-btn" id="studyPrioRec" onclick="setStudyPrio('권장')">📚 권장만</button>
      </div>
    </div>
    <button class="start-btn" onclick="startStudy()">시작하기 →</button>
  </div>

  <!-- Flashcard -->
  <div class="flashcard-wrap" id="flashcardWrap">
    <div class="study-progress" id="fcProgress"></div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="fcBar"></div></div>

    <div class="fc-card">
      <div class="fc-label">이 설명에 해당하는 용어는?</div>
      <div class="fc-desc-text" id="fcDesc"></div>
      <div class="fc-sub-text" id="fcHint"></div>
      <div class="fc-reveal-wrap">
        <button class="fc-reveal-btn" id="fcRevealBtn" onclick="revealTerm()">👆 정답 보기</button>
        <div class="fc-answer-box" id="fcAnswerBox">
          <div class="fc-answer-term" id="fcTerm"></div>
          <div class="fc-answer-sub" id="fcSub"></div>
        </div>
      </div>
    </div>

    <div class="fc-nav">
      <button onclick="fcMove(-1)">← 이전</button>
      <button class="primary" onclick="fcMove(1)">다음 →</button>
    </div>
    <button class="study-back-btn" onclick="backToSetup()">← 설정으로 돌아가기</button>
  </div>

  <!-- Quiz -->
  <div class="quiz-wrap" id="quizWrap">
    <div class="study-progress" id="qzProgress"></div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="qzBar"></div></div>
    <div class="quiz-card-box" id="quizCard">
      <div class="quiz-q-label">이 설명에 해당하는 용어를 입력하세요</div>
      <div class="quiz-desc-box" id="qzDesc"></div>
      <input type="text" class="quiz-input" id="qzInput" placeholder="용어를 입력하세요..." onkeydown="if(event.key==='Enter')checkQuiz()">
      <button class="quiz-check-btn" onclick="checkQuiz()">정답 확인</button>
      <div class="quiz-result" id="qzResult"></div>
    </div>
    <div class="quiz-score" id="quizScore">
      <div class="score-num" id="scoreNum"></div>
      <div class="score-sub" id="scoreSub"></div>
      <button class="start-btn" onclick="restartStudy()" style="margin-top:16px">다시 풀기</button>
      <button class="study-back-btn" onclick="backToSetup()">← 새로 시작</button>
    </div>
    <button class="study-back-btn" id="qzBackBtn" onclick="backToSetup()">← 설정으로 돌아가기</button>
  </div>

</div>
</div>

</div>

<script>
const RAW = [{"category": "🏢 내부 조직", "term": "CC", "korean": "", "english": "", "description": "Corporate Center. 모비데이즈 내부 조직 명칭.", "note": "", "priority": "필수"}, {"category": "🏢 내부 조직", "term": "LM", "korean": "", "english": "", "description": "Lead Manager. 팀 내 리드 역할을 담당하는 직책.", "note": "", "priority": "필수"}, {"category": "🏢 내부 조직", "term": "P&A", "korean": "", "english": "", "description": "Planning & Analysis. 기획 및 분석을 담당하는 팀.", "note": "", "priority": "필수"}, {"category": "🏢 내부 조직", "term": "PM", "korean": "", "english": "", "description": "Partnership & Media. 매체사 파트너십을 담당하는 팀.", "note": "", "priority": "필수"}, {"category": "🏢 내부 조직", "term": "R&D", "korean": "", "english": "", "description": "Research & Development. 연구개발 팀.", "note": "", "priority": "필수"}, {"category": "🏢 내부 조직", "term": "BD", "korean": "", "english": "", "description": "Business Development. 신규 사업 개발 담당. 모비인터치 사업 포함.", "note": "", "priority": "필수"}, {"category": "🏢 내부 조직", "term": "물류팀", "korean": "", "english": "", "description": "(모비콘) 물류센터에서 상품 입고, 피킹, 패킹, 출고까지 전 과정을 담당하는 팀.", "note": "", "priority": "필수"}, {"category": "🏢 내부 조직", "term": "서비스팀", "korean": "", "english": "Service Tea", "description": "(모비콘) OMS, WMS 등 시스템 이슈를 발견하고 개선하는 팀.", "note": "", "priority": "필수"}, {"category": "🏢 내부 조직", "term": "B2B팀", "korean": "회사 간 거래", "english": "Business to Business Team", "description": "(모비콘) 대량 구매 고객을 발굴하고 계약·발주·사후 관리까지 담당하는 팀.", "note": "", "priority": "필수"}, {"category": "🏢 내부 조직", "term": "CC팀", "korean": "고객 관리", "english": "Customer Care Team", "description": "(모비콘) 영어·스페인어로 24시간 고객 문의를 응대하는 필리핀 상주 고객 관리 팀.", "note": "", "priority": "필수"}, {"category": "🏢 내부 조직", "term": "CS팀", "korean": "고객 만족", "english": "Customer Satisfaction Team", "description": "(모비콘) 고객 응대 품질 관리, 수출 서류 관리, 물류 파트너십 관리 등 서비스 전반을 개선하는 팀.", "note": "", "priority": "필수"}, {"category": "🏢 내부 조직", "term": "MD팀", "korean": "", "english": "Merchandise Team", "description": "(모비콘) 상품 기획·디자인·소싱·온라인 업로드를 담당하는 팀.", "note": 가능", "note": "", "priority": "권장"}, {"category": "📣 마케팅", "term": "정보값 (Data Value / Attribute)", "korean": "", "english": "", "description": "스프레드시트에서는 하나의 열(Column)을 의미. 데이터 간 구분이 가능하게 하는 고유 속성.", "note": "", "priority": "권장"}, {"category": "📣 마케팅", "term": "지역구표", "korean": "", "english": "", "description": "세일즈 인력에게 지역구(담당 구역)를 할당하고 각자의 구역 내에서 실적을 경쟁하는 방식.", "note": "", "priority": "권장"}, {"category": "📣 마케팅", "term": "티어 (Tier 등급)", "korean": "", "english": "", "description": "광고주 규모에 따른 등급 분류.\n- S TIER: 연간 100억 이상\n- 1 TIER: 연간 50억 이상\n- 2 TIER: 연간 30억~50억\n(이하 동일한 기준으로 세분화)", "note": "", "priority": "필수"}, {"category": "📣 마케팅", "term": "폴리싱 (Polishing)", "korean": "", "english": "", "description": "PPT 작업 시 내용을 채우는 것이 아닌, 기입된 내용을 보기 좋게 다듬는 디자인 작업.", "note": "", "priority": "권장"}, {"category": "📣 마케팅", "term": "ADTF", "korean": "", "english": "", "description": "업종 발굴 프로젝트. 사내 DB에 새로운 업종·기업 정보를 추가하는 프로젝트. \"AD-TF\" 자체가 프로젝트명으로 쓰이기도 함.", "note": "", "priority": "권장"}, {"category": "📣 마케팅", "term": "AF시트", "korean": "", "english": "", "description": "AF 지수와 세일즈 인력별 액션플랜을 기록하는 시트. 일간 회의의 핵심 관리 문서.", "note": "", "priority": "필수"}, {"category": "📣 마케팅", "term": "R", "korean": "", "english": "", "description": "RFP(제안요청서)상의 예산. 즉, 예상 마케팅 집행 금액.", "note": "", "priority": "필수"}, {"category": "📣 마케팅", "term": "R0", "korean": "", "english": "", "description": "R을 아직 확보하지 못한 기업에 부여하는 R 지수.", "note": "", "priority": "권장"}, {"category": "📣 마케팅", "term": "R지수", "korean": "", "english": "", "description": "R(예산)을 기반으로 형성된 지표. 예: R2 = RFP를 받을 수 있고 금액은 40억.", "note": "", "priority": "권장"}, {"category": "📣 마케팅", "term": "RX", "korean": "", "english": "", "description": "R을 확보한 기업의 티어를 함께 표기한 지표. 예: R1 = 1 TIER 기업의 R 확보.", "note": "", "priority": "필수"}, {"category": "📣 마케팅", "term": "가정산", "korean": "", "english": "", "description": "세일즈포스 BACKDATA에 실소진액을 입력하는 것. 이를 \"가정산\"이라 지칭.", "note": "", "priority": "권장"}, {"category": "📣 마케팅", "term": "광고주 공유금액", "korean": "", "english": "", "description": "실소진액의 월 단위 총합이 세일즈포스에서 가정산으로 입력될 때 사용하는 항목명.", "note": "", "priority": "권장"}, {"category": "📣 마케팅", "term": "디덕션 (Deduction)", "korean": "", "english": "", "description": "주로 NCPI 광고에서 Fraud(부정 클릭)에 해당하는 광고비를 제외하는 것. 광고주에 대한 일종의 AS 개념.\n예: 500건 다운로드 중 100건이 Fraud라면 해당 금액을 차감.", "note": "", "priority": "권장"}, {"category": "📣 마케팅", "term": "딥링크 (Deep Link)", "korean": "", "english": "", "description": "유저를 앱 내 특정 페이지로 직접 연결하는 링크. 모바일용 딥링킹, 디퍼드 딥링킹, 콘텍스트 딥링킹 세 유형이 있음.", "note": "", "priority": "권장"}, {"category": "📣 마케팅", "term": "매체선지급요청서", "korean": "", "english": "", "description": "매체비용을 먼저 지급하기 위해 캠페인 담당자가 재무팀에 요청하는 서류. 셀프서빙 빅미디어 운영 시 사용.", "note": "", "priority": "권장"}, {"category": "📣 마케팅", "term": "매출이익", "korean": "", "english": "", "description": "실소진액 × 수수료율로 산출되는 모비데이즈의 순수익. = 광고주 공유금액 − 매체비용.", "note": "", "priority": "권장"}, {"category": "📣 마케팅", "term": "수수료율", "korean": "", "english": "", "description": "광고주 또는 매체와 계약한 수수료 비율.", "note": "", "priority": "필수"}, {"category": "📣 마케팅", "term": "실 소진액", "korean": "", "english": "", "description": "실제로 소진되어 발생한 모비데이즈의 매출(Gross 개념). 수수료 포함.", "note": "", "priority": "필수"}, {"category": "📣 마케팅", "term": "원링크 (OneLink)", "korean": "", "english": "", "description": "유저의 OS를 체킹하고 그에 맞는 앱스토어로 랜딩 시켜주는 링크 / \n원링크를 사용하지 않는다면 AOS, iOS 캠페인 각각 만들고 그에 맞는 랜딩을 기입해야하지만 원링크를 사용하다면 1개의 캠페인과 1개의 링크로 OS 모두 커버", "note": "", "priority": "권장"}, {"category": "📣 마케팅", "term": "정산 주차", "korean": "", "english": "", "description": "매월 마지막 주차. 세금계산서 발행 기준으로 이 주차에만 데이터를 업데이트함. 보통 4~5주차.", "note": "", "priority": "권장"}, {"category": "📣 마케팅", "term": "필수운영액", "korean": "", "english": "", "description": "수주 확정된 금액. 반드시 집행해야 하는 금액(Gross 개념, 수수료 포함).", "note": "", "priority": "필수"}, {"category": "📣 마케팅", "term": "Back Data (BD)", "korean": "", "english": "", "description": "주 단위 실소진액을 기반으로 월간 매출과 향후 분기 예상 매출을 가늠하는 데이터 시트.", "note": "", "priority": "권장"}, {"category": "📣 마케팅", "term": "CUID", "korean": "", "english": "", "description": "광고주 앱/웹이 설정한 고유 사용자 식별자. 앱스플라이어 데이터를 내부 데이터와 매칭할 때 사용.", "note": "", "priority": "권장"}, {"category": "📣 마케팅", "term": "GTM (Google Tag Manager)", "korean": "구글 태그 관리자", "english": "Google Tag Manager", "description": "웹사이트 코드를 직접 수정하지 않고 외부에서 자바스크립트 태그를 삽입·관리할 수 있는 도구. 트래킹 코드(GA 등) 관리에 사용.", "note": "", "priority": "권장"}, {"category": "📣 마케팅", "term": "UTM (Urchin Tracking Module)", "korean": "", "english": "", "description": "URL 뒤에 붙는 파라미터 코드. 어떤 매체·캠페인에서 유입됐는지 Google Analytics에 전달함.", "note": "", "priority": "권장"}, {"category": "📣 마케팅", "term": "매체축약어", "korean": "", "english": "", "description": "내부에서 자주 쓰는 매체 약어.\nFB=페이스북, IG=인스타그램, YT=유튜브, 커넥트=모비커넥트", "note": "", "priority": "권장"}, {"category": "📣 마케팅", "term": "NOSP (Naver Open Sales Platform)", "korean": "", "english": "", "description": "네이버 광고 캠페인 등록·관리 시 접속하는 플랫폼 명칭.", "note": "", "priority": "권장"}, {"category": "📣 마케팅", "term": "GMV", "korean": "", "english": "", "description": "Gross Merchandise Value. 총 거래액(광고주 결제액 기준).\n예: \"월 GMV 30억 달성\"", "note": "실적·매출 관련 주요 약어", "priority": "필수"}, {"category": "📣 마케팅", "term": "NR / NRev", "korean": "", "english": "", "description": "Net Revenue. 영업수익 = 거래액 × 수수료율.\n내부 실적 보고 시 NR로 표기.", "note": "실적·매출 관련 주요 약어", "priority": "필수"}, {"category": "📣 마케팅", "term": "GR / GRev", "korean": "", "english": "", "description": "Gross Revenue. 할인·리베이트 차감 전 매출총액.", "note": "실적·매출 관련 주요 약어", "priority": "권장"}, {"category": "📣 마케팅", "term": "ARPU", "korean": "", "english": "", "description": "Average Revenue Per User. 유저 1인당 평균 매출. 앱·플랫폼 지표.", "note": "실적·매출 관련 주요 약어", "priority": "권장"}, {"category": "📣 마케팅", "term": "ARPPU", "korean": "", "english": "", "description": "Average Revenue Per Paying User. 결제 유저 기준 매출. 게임·앱 광고주 중심.", "note": "실적·매출 관련 주요 약어", "priority": "권장"}, {"category": "📣 마케팅", "term": "ROI", "korean": "", "english": "", "description": "Return on Investment. 투자 대비 수익률 = (수익 − 비용) / 비용. 퍼포먼스 핵심 지표.", "note": "실적·매출 관련 주요 약어", "priority": "필수"}, {"ca ption": "제안요청서. 광고주가 대행사에 제안을 요청할 때 전달하는 문서. 대부분 대외비.", "note": "", "priority": "필수"}, {"category": "💼 비즈니스", "term": "SCOPE (스코프)", "korean": "", "english": "", "description": "업무 범위. 프로젝트에서 어디까지 수행할지를 정의함. 예: \"이번 스코프엔 디자인 수정 불포함.\"", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "SOV (Share of Voice / Search of Volume)", "korean": "", "english": "", "description": "Share of Voice: 월별 광고소재와 랜딩url, 광고비, 예산 집중도 등을 파악하는 데에 쓰이는 솔루션이자 사이트\n검색 광고 업계에선 Search of volume 로 검색량 분석의 의미로 사용된다.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "T/O (Table of Organization)", "korean": "", "english": "", "description": "조직 내 충원 가능한 빈자리. 예: \"T/O가 생겼다\" = 해당 팀에서 채용 가능.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "TF (Task Force)", "korean": "", "english": "", "description": "특정 목적을 위해 한시적으로 구성된 임시 조직.", "note": "", "priority": "필수"}, {"category": "💼 비즈니스", "term": "TFT (Task Force Team)", "korean": "", "english": "", "description": "TF를 실제로 수행하는 팀. 각 부서에서 인원을 차출해 협업하는 구조.", "note": "", "priority": "필수"}, {"category": "💼 비즈니스", "term": "ASAP (As Soon As Possible)", "korean": "", "english": "", "description": "가능한 한 빨리. 예: \"ASAP으로 검토 부탁드립니다.\"", "note": "", "priority": "필수"}, {"category": "💼 비즈니스", "term": "BCC (Blind Carbon Copy)", "korean": "", "english": "", "description": "이메일 숨은 참조. 수신자에게 보이지 않게 함께 메일을 받는 사람 지정.", "note": "", "priority": "필수"}, {"category": "💼 비즈니스", "term": "CC (Carbon Copy)", "korean": "", "english": "", "description": "이메일 참조. 내용을 알고 있어야 할 사람을 추가. 슬랙에서는 주담당자 외 태그 시 사용.", "note": "", "priority": "필수"}, {"category": "💼 비즈니스", "term": "FW (Forward)", "korean": "", "english": "", "description": "이메일 전달. 받은 메일을 다른 사람에게 그대로 전달.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "FYI (For Your Information)", "korean": "", "english": "", "description": "참고용 정보 공유. \"별도 액션 없이 확인만 해주세요\" 뉘앙스.", "note": "", "priority": "필수"}, {"category": "💼 비즈니스", "term": "RE (Reply)", "korean": "", "english": "", "description": "이메일 답장. 제목에 \"RE:\"가 붙으면 이전 메일에 대한 회신.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "RSVP (Répondez S'il Vous Plaît)", "korean": "", "english": "", "description": "참석 여부 회신 요청. 초대·행사 메일에서 사용. 예: \"RSVP by Friday.\"", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "TBA (To Be Announced)", "korean": "", "english": "", "description": "추후 공지 예정. 아직 발표 전.", "note": "", "priority": "필수"}, {"category": "💼 비즈니스", "term": "TBD (To Be Determined)", "korean": "", "english": "", "description": "추후 결정 예정. 아직 미확정.", "note": "", "priority": "필수"}, {"category": "💼 비즈니스", "term": "데드라인 (Deadline) / Due Date", "korean": "", "english": "", "description": "마감일·마감 시각. 예: \"데드라인은 금요일 18시입니다.\"", "note": "", "priority": "필수"}, {"category": "💼 비즈니스", "term": "로컬 (Local)", "korean": "", "english": "", "description": "\"지역\" 또는 \"국내\"를 뜻함. 글로벌의 반대 개념. 예: \"국내 로컬 캠페인\"", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "리젝트 (Reject)", "korean": "", "english": "", "description": "거절·반려. 컨펌 요청이나 제안이 승인되지 않은 것.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "기능별 조직 (Functional Organization)", "korean": "", "english": "", "description": "조직 내 업무를 기능별(인사, 재무, 마케팅 등)로 나누어 각 분야의 전문가가 전문적으로 일하는 구조.\n전문성이 높지만 부서 간 협업이나 소통이 어렵다는 단점이 있음.", "note": "e.g. APPLE 디자인 부서 / 마케팅 부서 etc", "priority": "권장"}, {"category": "💼 비즈니스", "term": "레거시 기업 (Legacy Company)", "korean": "", "english": "", "description": "업력이 오래되고 규모가 큰 기존 전통 기업. 스타트업과 대비되는 개념.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "매스티지 마케팅 (Masstige Marketing)", "korean": "", "english": "", "description": "mass (대중) + prestige product (명품)의 합성어로, 합리적 가격에 감성적 만족을 주는 ‘대중적 명품’ 전략.\n→ 실속형 고급소비를 추구하기 때문에 합리적인 가격 속에서 감성적 만족을 제공해야 한다. \n명품보다 가격이 낮고 대량으로 생산 / 동류집단에 속한다는 자긍심과 심리적 동질감을 느끼게 함 / 명품 브랜드의 대중화 전략을 위한 브랜드의 확장 형태", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "버티컬 매체 (Vertical Media)", "korean": "", "english": "", "description": "특정 주제나 산업군에 특화된 전문 매체. 예: 패션 전문지, IT 산업 뉴스 등.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "빅배스 (Big Bath)", "korean": "", "english": "", "description": "부실요소를 한 회계연도에 모두 반영하여 위험요인을 일시에 제거하는 회계기법 (목욕을 깨끗이 해서 몸에서 더러운 것을 없앤다'라는 뜻에서 유래)\n경영진 교체 시 새로 부임하는 기업의 CEO가 전임자들의 재임 기간에 누적됐던 손실이나 향후 잠재적 부실요소 등을 회계장부 정리를 통해 \n실적부진의 책임을 전임자에게 넘기고 다음 해 더 큰 실적을 유도하기 위해 자신의 공적을 부각시키는 전략", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "빌바오 효과 (Bilbao Effect)", "korean": "", "english": "", "description": "문화 시설을 통한 도시 재생 효과.\n쇠퇴해가던 스페인의 지방공업도시 빌바오가 1997년 도시재생사업의 일환으로 문화시설인 구겐하임 미술관을 유치하여 경제적 부흥을 가져온 데서 비롯됨.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "합자회사", "korean": "", "english": "", "description": "무한책임사원: 회사 운영을 담당하고 손실에 대해 무한히 책임짐.\n\n유한책임사원: 출자금 한도 내에서만 책임짐.\n→ 예: 사모투자합자회사(PEF)가 대표적인 사례. (GP=무한책임사원 / LP=유한책임사원)", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "합명회사", "korean": "", "english": "", "description": "모든 사원이 무한책임사원으로 구성된 회사 형태.\n즉, 회사에 손실이 발생하면 사원 개인의 재산으로까지 무한히 책임을 져야 함.\n→ “전원 무한책임” 구조로, 신뢰관계가 강한 소규모 사업에 주로 쓰임.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "무한책임사원", "korean": "", "english": "", "description": "회사의 채무에 대해 자신의 모든 재산으로 책임을 져야 하는 사원.\n합명회사에서는 모든 사원이, 합자회사에서는 일부 사원이 무한책임사원임.\n→ 투자 업계에서는 GP(General Partner)가 여기에 해당.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "유한책임사원", "korean": "", "english": "", "description": "회사의 손실에 대해 출자금 한도 내에서만 책임을 지는 사원.\n경영에는 참여하지 않고, 이익·손실에 대한 배분만 받음.\n→ 투자 펀드에서는 LP(Limited Partner)가 여기에 해당.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "사업부 조직 (Divisional Organization)", "korean": "", "english": "", "description": "조직 내에서 기능·제품·지역 단위로 분화된 독립 사업 단위 조직 구조. 각 사업부가 독자적으로 운영됨.", "note": "e.g. 삼성전자 반도체사업부 / 생활가전사업부 etc", "priority": "권장"}, {"category": "💼 비즈니스", "term": "역기저 (Reverse Base Effect)", "korean": "", "english": "", "description": "작년 혹은 직전 분기 실적이 너무 좋아서 이번 분기 실적이 조금만 감소해도 실적이 나빠 보이는 효과", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "지주회사 (Holding Company)", "korean": "", "english": "", "description": "다른 주식회사의 주식을 소유, 지배하는 것을 주 사업활동 목적으로 삼는 주식회사. 넓은 뜻으로는 헤지펀드나 사모펀드 등 증권투자회사도 지주회사에 들어가나 실제로 사람들이 지주회사라고 하는 것은 기업집단의 지배회사를 의미 (OO지주, OO지주회사, OO홀딩스 등의 이름)", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "치킨게임 (Chicken Game)", "korean": "", "english": "", "description": "어떤 사안에 대해 대립하는 두 집단이 있을 때 한쪽이 그 사안을 포기하면 상대방에 비해 손해를 보게 되지만, \n양쪽 모두 포기하지 않는 경우 가장 나쁜 결과가 벌어지는 게임\n→ 주로 가격경쟁, 시장 점유율 싸움, 출혈경쟁 등을 설명할 때 사용.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "컨소시엄 (Consortium)", "korean": "", "english": "", "description": "2가지 이상의 개인 또는 회사, 단체, 정부의 협동체로 공통의 활동에 참여하는 것\n모비데이즈는 DA(디지털 광고)를 주로 하기에 SA(검색광고)나 바이럴, 동영상 제작, 인스타 이벤트 관리 등의 업무가 필요할 때에 다른 회사와 협약을 맺어서 일을 하는 것이 컨소시엄", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "큐레이션 서비스 (Curation Service)", "korean": "", "english": "", "description": "개인의 취향을 분석해 적절한 콘텐츠를 추천해주는 것. 정보과잉시대에 의미 있는 정보를 찾아내 더욱 가치 있게 제시해주는 것을 의미한다. 콘텐츠가 많아질수록 선별된 양질의 정보에 대한 수요가 느는데 이런 수요를 충족시키기 위한 것으로 신규 비즈니스로 급부상하고 있다.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "페르소나 마케팅 (Persona Marketing)", "korean": "", "english": "", "description": "소비자들에게 각인될만한 대외적인 이미지 혹은 캐릭터를 설정해 기업 브랜드를 홍보하는 마케팅 전략\n→ 브랜드의 감정적 연결과 충성도를 높이는 콘텐츠 중심 마케팅 기법", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "프로젝트 (Project)", "korean": "", "english": "", "description": "특정한 목적을 이루기 위해서 여럿이 함께 모여서 하는 일 또는 작업", "note": "프로그램과 차이: \n프로젝트는 구별되며 지정된 기간 동안 진행되지만\n프로그램은 기업의 결과를 지속적으로 얻음", "priority": "권장"}, {"category": "💼 비즈니스", "term": "프로젝트 툴 (Project Tool)", "korean": "", "english": "", "description": "프로젝트 및 협업 관리를 위한 툴로 대표적으로 Jira, Trello, Smartsheet와 같은 서비스가 있다", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "BI (Business Intelligence)", "korean": "", "english": "", "description": "Business Intelligence, 기업내에 흩어져 있는 데이터를 수집하여 일목요연하게 정리하고, 기업 경영에 꼭 필요한 정보들을 즉각적으로 제공해 주는 툴", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "CD (Creative Director)", "korean": "", "english": "", "description": "Creative Director의 줄임말로 광고주가 의뢰한 제품이나 자료를 검토하여 광고전략을 수립하고, 광고 표현형태 및 제작방향을 설정하는 \"광고기획총괄관리자\"를 의미", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "CX (Customer Experience)", "korean": "", "english": "", "description": "고객이 브랜드와 만나는 모든 접점에서 느끼는 총체적 경험.\n→ 마케팅, 구매, 서비스 전 과정에서의 감정적·기능적 만족도를 관리.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "FMCG (Fast Moving Consumer Goods)", "korean": "", "english": "", "description": "빠르게 회전되는 소비재로 저가 저용량 제품들로 재고 회전율이 빠른 상품군. → 예: 생필품, 음료, 식품, 세제 등.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "HMR (Home Meal Replacement)", "korean": "", "english": "", "description": "가정간편식.\n별도 조리 과정 없이 간단히 데워 먹거나 바로 섭취할 수 있는 완전·반조리 식품.\n→ 현대인의 식생활 변화로 급성장한 편의식 시장의 대표 제품군.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "MC (Integrated Marketing Communication)", "korean": "", "english": "", "description": "광고, PR, 프로모션, 디지털 등 모든 마케팅 채널을 일관된 메시지로 통합 운영하는 전략.\n→ “하나의 브랜드, 하나의 목소리(One Voice)” 원칙 기반.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "MUV (Monthly Unique Visitors)", "korean": "", "english": "", "description": "월간 순방문자 수.\n→ 웹사이트나 앱을 한 달 동안 이용한 ‘중복되지 않는 방문자 수’를 나타내는 지표로, 디지털 마케팅·광고 집행의 핵심 데이터로 사용됨.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "O4O (Online for Offline)", "korean": "", "english": "", "description": "온라인 기업이 보유하고 있는 고객 정보와 자산을 기반으로 오프라인으로 사업 영역을 확대하면서 새로운 매출을 창출하는 비즈니스 플랫폼\n온라인보다 오프라인에 무게를 두고 있다는 것이 가장 큰 차이점이며 대표적인 사례로 아마존 고와 다방 케어센터가 있다.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "OKR (Objectives and Key Results)", "korean": "", "english": "", "description": "조직이 달성해야 할 목표(Objectives)와 이를 측정할 핵심 결과(Key Results)를 설정하는 관리 체계.\n→ 구글, 넷플릭스 등 글로벌 기업에서 활용되는 성과관리 프레임워크.", "note": "KPI와 차이:\nKPI는 목표가 제대로 수행되었는지를 '평가'하기 위한 것이고 \nOKR에서 KR(Key Results)는 목표를 달성되고 난 후의 조감도", "priority": "권장"}, {"category": "💼 비즈니스", "term": "POC (Point of Contact)", "korean": "", "english": "", "description": "조직 간 또는 팀 간 소통의 공식 창구(담당자)를 뜻함.\n→ “이 건의 POC가 누구야?” = 담당자 또는 주 커뮤니케이션 포인트를 의미.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "RTD (Ready To Drink)", "korean": "", "english": "", "description": "바로 마실 수 있도록 제조된 음료 제품 형태.\n→ 병, 캔, 팩 포장으로 유통되며 커피·홍차·주스 등에서 흔히 사용됨.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "Whitelist", "korean": "", "english": "", "description": "특정 기관·단체가 정책·기술·제품의 내용을 공식적으로 설명하거나 안내하기 위해 발행하는 문서.\n→ 블록체인·정책 제안·기술보고 등에서 자주 사용됨", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "ZBB", "korean": "", "english": "", "description": "영기준예산제도 (Zero -Based Budgeting). 예산을 편성할 때 전년도 예산에 기초하지 않고, 0에서 다시 필요성을 검토해 예산을 편성하는 방식. \n1970년대 미국에서 기존의 점증주의 예산제도를 비판하며 개발된 예산 제도.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "간트차트 (Gantt Chart)", "korean": "", "english": "", "description": "간트 차트(Gantt chart)는 프로젝트 일정관리를 위한 바(bar)형태의 도구로서, 업무별로 일정의 시작과 끝을 그래픽으로 표시하여 전체 일정을 한눈에 볼 수 있다. 또한, 각 업무(activities) 사이의 관계를 보여줄 수도 있다", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "마일스톤 (Milestone)", "korean": "", "english": "", "description": "프로젝트 진행 과정에서 특정할 만한 건, 성공을 위해 반드시 거쳐야 하는 중요한 지점\n예: 기획 완료, 시제품 완성, 런칭 등 — 성공을 위해 반드시 거쳐야 하는 단계.", "note": "e.g. 시공착수, 기초완료, 벽체완료 등 중요한 시점", "priority": "권장"}, {"category": "💼 비즈니스", "term": "ROI (Return On Investment)", "korean": "", "english": "", "description": "투자 대비 얼마나 이익이 발생했는지를 나타내는 지표.\nROI = (순이익 / 투자금) × 100%\n→ 광고·마케팅 효율을 판단할 때 가장 많이 쓰이는 핵심 지표.", "note": "", "priority": "권장"}, {"category": "💼 비즈니스", "term": "EOD (End Of Day)", "korean": "", "english": "", "description": "오늘 업무 끝나기 전까지. 예: \"자료 EOD까지 부탁드립니다.\"", "note": "", "priority": "필수"}, {"category": "💼 비즈니스", "term": "WBS (Work Breakdown Structure)", "korean": "", "english": "", "description": "작업분류체계 / 프로젝트 목표를 달성하기 위해 필요한 업무를 인도물 중심으로 계층화하여 세분화한 구조. 프로젝트 범위와 산출물 간의 관계를 명확히 함.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "2차 전지 (Secondary Battery)", "korean": "", "english": "", "description": "외부 전기 에너지를 화학 에너지로 저장해 두었다가 필요할 때 전기를 다시 생산하는 충전식 전지.\n전기차, 스마트폰, 에너지저장장치(ESS) 등 다양한 산업에서 사용됨.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "가치 공학 (Value Engineering, VE)", "korean": "", "english": "", "description": "최소의 생애주기비용으로 최대의 가치를 실현하기 위한 기법.\n시설물이나 제품의 기능을 분석해 비용을 절감하면서 성능과 품질을 향상시키는 접근법.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "개발부채 (기술부채 / Technical Debt)", "korean": "", "english": "", "description": "현 시점에서 더 오래 소요될 수 있는 임시방편적·비효율적인 코드를 선택함으로써, 향후 유지보수 시 추가 비용이 발생하는 상태를 의미.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "격동의 시기 (Turbulent Period)", "korean": "", "english": "", "description": "사회·경제·기술 변화 속도가 매우 빠르고 급격한 시대를 의미.\n변화에 대응하지 못하면 뒤처지거나 도태될 수 있음을 경고하는 표현.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "그레이 수소 (Gray Hydrogen)", "korean": "", "english": "", "description": "천연가스의 주성분인 메탄(CH₄)을 고온·고압 수증기와 반응시켜 생산한 수소.\n생산 과정에서 이산화탄소가 발생하기 때문에 친환경 수소로 분류되지 않음.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "그린 수소 (Green Hydrogen)", "korean": "", "english": "", "description": "재생에너지(태양광, 풍력 등)를 이용해 물을 전기분해(수전해) 하여 생산한 수소.\n탄소 배출이 없어 ‘청정 수소’ 또는 ‘탄소중립 수소’로 불림.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "나스 (NAS, Network Attached Storage)", "korean": "", "english": "", "description": "네트워크 결합 스토리지 (Network Attatched Storage)로 LAN으로 연결하는 외장 하드디스크이다. 사내 파일 공유나 백업용으로 많이 사용됨.\n반대 개념은 컴퓨터에 직접 연결해서 쓰는 DAS(직접 결합 저장장치, Direct Attatched Storage)로 내장형 하드디스크나 eSATA 규격 외장 하드디스크가 여기에 해당된다.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "니어쇼어링 (Nearshoring)", "korean": "", "english": "", "description": "지금까지 사용하던 공급 업체보다 당사 또는 고객과 지리적으로 가까운 국가의 공급 업체로 전환하는 것\n공급망 리스크를 줄이고, 협업 효율을 높이기 위한 오프쇼어링(Offshoring)의 대안.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "더블 카운팅 (Double Counting)", "korean": "", "english": "", "description": "상장사 모회사가 자회사를 상장시킬 때, 양쪽 기업 가치가 시장에서 중복 계산되는 현상.\n→ 이로 인해 모회사 주가가 하락하는 경우가 많아 상장사 소액주주들이 핵심 자회사 상장을 꺼리기도 함", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "데드 캣 바운스 (Dead Cat Bounce)", "korean": "", "english": "", "description": "주가가 급락한 뒤 일시적으로 소폭 반등하는 현상. ‘죽은 고양이도 떨어지면 한 번은 튄다’는 의미에서 나온 표현으로, 일시적 반등 후 재하락할 가능성이 높음.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "디지털 트윈 (Digital Twin)", "korean": "", "english": "", "description": "현실 속 사물이나 시스템을 컴퓨터상에 그대로 복제(쌍둥이) 하여 시뮬레이션으로 미래 상황을 예측하고 문제를 사전에 점검하는 기술.\n제조업, 도시관리(스마트시티), 에너지 등 다양한 산업에 활용되며,됨.사회 미 산업 문제를 해결할 수 있는 기술로 주목받고 있음.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "레거시 (Legacy)", "korean": "", "english": "", "description": "IT에서 과거로부터 사용되어온 구식 시스템·코드·데이터 구조를 의미. 현재 시스템과의 호환성, 전환 비용 이슈가 존재.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "리쇼어링 (Reshoring)", "korean": "", "english": "", "description": "해외(저임금국)에 있던 생산·공급망을 인건비 절감 등을 이유로 국내로 다시 이전하는 전략. 제조업, 공급망 안정화 맥락에서 사용.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "브라운 수소 (Brown Hydrogen)", "korean": "", "english": "", "description": "석탄을 고온·고압에서 가스화해 생산한 수소. 탄소 배출이 매우 많음.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "블루 수소 (Blue Hydrogen)", "korean": "", "english": "", "description": "천연가스를 개질해 생산하되, 탄소를 포집·저장(CCS)하여 배출을 줄인 수소.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "스키마 (Schema)", "korean": "", "english": "", "description": "자료의 구조, 자료의 표현 방법, 자료 간의 관계를 형식 언어로 정의한 구조. 쉽게 말해, 정보가 어떻게 저장되고 연결되는지를 나타내는 설계도.\n→ 예: Draw.io, Lucidchart, IA(Information Architecture) 설계 등에서 사용.", "note": "유사개념: ERD *Entity Relationship Diagram, 개체-관계 모델", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "신북미자유무역협정 (USMCA)", "korean": "", "english": "", "description": "미국, 캐나다, 멕시코 간 자유무역협정, 공동시장의 한 형태로 분류되기도 한다. 자동차 역내 부품 비율 상향, 자동차 노동자 임금 인상, 무관세 쿼터제 등을 주 내용으로 한다.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "애자일 방법론 (Agile Methodology)", "korean": "", "english": "", "description": "소프트웨어 개발 방법론의 하나로, 처음부터 끝까지 계획을 수립하고 개발하는 폭포수 방법론과는 달리 개발과 함께 즉시 피드백을 받아서 유동적으로 개발하는 방법. 개발 방법론이 있는 개발 방법론 집합체의 원칙에 가깝다.\n→ “빠르게 만들고, 바로 피드백 받아, 즉시 수정한다”는 개발 문화의 핵심.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "옵트아웃 (Opt-out)", "korean": "", "english": "", "description": "데이터 추적이나 개인정보 수집에 대해 기본적으로 동의하지만, 사용자가 원할 경우 수집을 거부할 수 있는 선택권.\n→ 반대 개념: Opt-in (명시적 동의 기반 수집).", "note": "< > 옵트인: 추적 동의를 반드시 미리 구하는 것", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "채찍효과 (Bullwhip Effect)", "korean": "", "english": "", "description": "공급사슬관리에서 반복적으로 발생하는 문제점. 공급망(SCM)에서 수요 정보가 단계별로 전달될 때 왜곡이 커지는 현상.\n→ 소비자 수요 변화가 과도하게 증폭되어 재고 과잉 또는 품절 사태가 발생함.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "트러블슈팅 (Troubleshooting)", "korean": "", "english": "", "description": "작업을 진행하는 도중에 문제가 발생했을 때 이것을 진단하고 해결하는 일\n→ IT, 운영, 프로젝트 관리 전반에서 필수적인 문제해결 접근법", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "프로토콜 (Protocol)", "korean": "", "english": "", "description": "외교 - 국가 간의 원활한 교류를 위해 만들어진 의례 (약속, 규율, 국제법). 쉽게 말해 외교용 언어.\n통신 - 컴퓨터들 간의 원활한 통신을 위해 지키기로 약속한 규약. 신호 처리법, 오류처리, 암호, 인증, 주소 등을 포함한다.\n보통 통신의 의미롤 많이 사용하며 정보의 교환 방식을 정의하는 규칙 체계라고 통칭할 수 있음", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "핑크수소 (Pink Hydrogen)", "korean": "", "english": "", "description": "원전(핵발전소)에서 생성된 전기와 증기를 이용해 수전해 방식으로 생산한 수소.\n→ 탄소 배출이 적지만, 원전 의존성으로 인해 논쟁이 존재함.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "AR (Augmented Reality)", "korean": "", "english": "", "description": "증강현실(Augmented Reality), 실제로 존재하는 환경에 가상의 사물이나 정보를 합성하여 마치 원래의 환경에 존재하는 사물처럼 보이도록 하는 컴퓨터 그래픽 기법", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "DT (Digital Transformation)", "korean": "", "english": "", "description": "기업이 기존 비즈니스 프로세스를 디지털 기술 중심으로 전환하는 전략.\n→ AI·클라우드·데이터 기반 업무 혁신.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "ERP (Enterprise Resource Planning)", "korean": "", "english": "", "description": "전사적 자원 관리 시스템.\n회계·인사·물류·재고 등 기업 핵심 자원을 통합 관리하는 시스템.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "MR (Mixed Reality)", "korean": "", "english": "", "description": "가상의 물체를 현실 공간에 띄우거나, 현실의 물체를 인식해 그 주변에 가상 공간을 구성하는 기술.\n→ AR(증강현실)과 VR(가상현실)의 장점을 결합한 혼합현실 기술", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "PO (Product Owner)", "korean": "", "english": "", "description": "제품(또는 플랫폼 서비스)의 개발 과정과 방향성을 책임지는 관리자 혹은 리더.\n→ 애자일(Agile) 조직 내에서 제품 백로그를 정의하고, 개발 우선순위를 결정함.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "SI 사업 (System Integration Business)", "korean": "", "english": "", "description": "기업이 필요로 하는 정보시스템의 기획·개발·구축을 통합적으로 수행하는 사업.\n→ IT 컨설팅·시스템 구축·운영까지 포함하며, 메타버스·ERP·금융 IT 등에도 활용됨.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "UGC (User-Generated Contents)", "korean": "", "english": "", "description": "사용자가 직접 만드는 콘텐츠로 고객 참여형 콘텐츠, 사용자 제작 콘텐츠를 의미한다. 개인 사용자가 동영상, 글, 사진 등을 생성하는 것이다.\n국내에서는 UCC 또는 사용자 재창조 콘텐츠로 알려져 있는 경우가 많다. 웹 2.0의 주요 개념인 참여, 개방, 공유를 대표하는 것이라고 할 수 있다.", "note": "", "priority": "권장"}, {"category": "🏭 산업/기술", "term": "VR", "korean": "", "english": "", "description": "가상현실(Virtual Reality), 컴퓨터 등을 사용한 인공적인 기술로 만들어낸, 실제와 유사하지만 실제가 아닌 어떤 특정한 환경이나 상황 혹은 그 기술\n→ 시각·청각 등 감각을 자극해 실제와 유사한 몰입 경험을 제공하는 기술", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "기술특례상장 (Technology Listing Exception)", "korean": "", "english": "", "description": "기술력이 우수한 기업에 대해 외부 검증기관을 통해 심사한 뒤 매출·이익이 적은 기업에게도 상장 기회를 주는 제도.\n현재 영업 실적이 미미하더라도 기술력과 성장성을 갖춘 기업일 경우 전문평가기관 기술평가나 상장주선인 추천으로 상장할 수 있는 제도.\n외부 전문평가기관 상장심의위원회의 기술심사 또는 상장주선인 추천을 통해 코스닥 상장 가능.", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "인큐베이팅 (Incubating)", "korean": "", "english": "", "description": "신생 기업이 정상적으로 운영될 수 있도록 자금, 인력, 공간, 네트워킹, 멘토링 등 다양한 자원을 지원해주는 활동.\n→ “초기 스타트업은 인큐베이팅 프로그램을 통해 사업 기반을 다집니다.”", "note": "스타트업을 위한 공간 대여를 하기도함\ne.g. 마루180, 스파크랩", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "EXIT 전략 (Exit Strategy)", "korean": "", "english": "", "description": "스타트업 출구전략으로써, 투자자가 기업에 투자한 자금을 회수하는 전략. IPO(상장), M&A(인수합병), 지분매각 등의 방식이 있음.", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "GP (General Partner)", "korean": "", "english": "", "description": "펀드를 실제로 운용하고 투자 결정을 내리는 주체(팀)\nLP(Limited Partner, 투자자)로부터 자금을 받아 운용하며, 투자기업 관리와 수익 창출을 책임짐.\n→ “GP는 펀드의 운용사, LP는 자금을 출자한 투자자입니다.”", "note": "LP: Limited Partner의 줄임말로 개인, 기관투자자를 의미 \nLP는 펀드에 자금을 출자하여 GP에게 운용 맡기고\n그 대가로 GP에게 보수 지급", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "VC (Venture Capital)", "korean": "", "english": "", "description": "벤처 캐피털을 의미하며, 성장가능성이 높은 스타트업에 자금을 투자하고,  경영·전략·기술 등을 함께 지원하는  높은 자본이득을 추구하는 금융자본 기관", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "3F / FFF (Family, Friends, Fools)", "korean": "", "english": "", "description": "초기 스타트업(seed 단계)에 투자하는 사람들을 지칭하는 표현.  창업자의 가족(Family), 친구(Friends), 그리고 리스크를 감수하는 개인 투자자(Fools)를 의미", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "라운드 (Round)", "korean": "", "english": "", "description": "스타트업의 투자 단계를 구분하는 용어.\n시리즈와 거의 동일하며, 기업 성장 단계 및 투자 규모에 따라 A라운드, B라운드 등으로 구분됨.(ex. 시리즈A=A라운드) /'라운드를 돌고 있다'는 표현은 현재 투자 유치중이라는 말로 해석.", "note": "e.g. 시드 > 시리즈A > ... > 시리드 D > IPO", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "리드투자자 / 클럽딜 (Lead Investor / Club Deal)", "korean": "", "english": "", "description": "리드투자자: 여러 투자자 중 가장 많은 금액을 투자하고, 투자 구조 설계 및 리스크 관리에 책임을 지는 주 투자자.\n클럽딜: 여러 VC가 하나의 라운드에 공동으로 투자하는 형태.\n→ “이번 라운드는 클럽딜 형태로 진행되며, A VC가 리드투자자입니다.”", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "모태펀드 (Fund of Funds)", "korean": "", "english": "", "description": "정부(중소벤처기업부 등)가 벤처기업 육성을 위해 조성한 펀드. 모태펀드가 VC(운용사)에 출자하면, VC는 이를 바탕으로 민간 자금과 함께 스타트업에 투자함. \n(cf. 민간펀드: 민간 기업이 투자 목적으로 출자한 펀드)", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "시리즈 (Series)", "korean": "", "english": "", "description": "스타트업의 단계별 투자 단계를 뜻하고, 특정 회사의 기업가치와 투자금액 확인 용도로 사용됨.\n보통 Seed(엔젤투자)→ Series A → Series B → Series C → IPO(상장) 순으로 진행되며, 뒤로 갈수록 투자 규모가 커짐.\n→ “시리즈B 투자를 마쳤다는 건, 이미 시장 검증이 된 단계라는 뜻이에요.”", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "린 스타트업 (Lean Startup)", "korean": "", "english": "", "description": "최소 기능 제품(MVP)을 빠르게 시장에 내놓고 피드백을 받아 개선하는 스타트업 운영 방법론. 애자일·고객개발 기반.", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "물적분할 (Physical Division)", "korean": "", "english": "", "description": "기업분할의 한 형태로, 모회사가 100% 지분을 가진 신설회사를 만드는 방식. 전문성 강화·투자유치에 활용됨.\n장점: 분할되는 사업의 전문성 향상 / 대규모 투자자금 유치 가능 / 특정사업만 골라서 투자 가능\n단점: 모회사 투자메리트 저하로 인한 소액주주들의 피해", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "버닝 (Burning)", "korean": "", "english": "", "description": "스타트업이 시장점유율 확보나 기업의 외형을 키우기 위해 적자 상태로 자금을 태우며 성장하는 전략. (“현금 버닝”)\n스타트업의 성장과정에서 매달 기업 손실이 누적되고, 이 손실로 인해 투자금이 타 버리기 때문에 쓰이는 용어", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "보호예수기간 (Lock-up Period)", "korean": "", "english": "", "description": "상장 후 일정 기간 동안 지분 매도 제한 제도. 투자자나 임직원이 일정 기간 주식을 팔 수 없음. (보통 6개월)\n증권회사 등이 투자자의 유가증권 및 중요 물품 등의 안전한 보관과 매도의 편리를 위해 이를 보호하는 것으로 보통 주식시장에서 '의무적'으로 보호예수를 해야 하는 의무보호예수를 의미한다.", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "부트스트래핑 (Bootstrapping)", "korean": "", "english": "", "description": "외부 투자 없이 창업자가 자신의 자금과 수익만으로 회사를 성장시키는 전략. (“자력 성장”)\n통계학 용어로 단일 랜덤 표본에서 복원으로 여러 표본을 가져와서 표본 추출 분포를 추정하는 방법을 의미", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "블라인드 펀드 (Blind Fund)", "korean": "", "english": "", "description": "투자 대상을 미리 정하지 않고 펀드를 조성한 뒤, 향후 유망 기업이 확보되면 투자하는 펀드 형태.", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "사모투자합자회사 (Private Equity Partnership)", "korean": "", "english": "", "description": "투자금을 모아 기업에 투자하고, 경영권 참여·구조개선 등을 통해 투자한 기업의 가치 상승시킨 뒤 수익을 사원(출자자)에게 배분하는 합자회사형 펀드. (PEF 형태)", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "상환전환우선주 (RCPS)", "korean": "", "english": "", "description": "Redeemable Convertible Preference Shares. 상환권 + 전환권 + 우선배당권이 결합된 주식 형태로, 스타트업 투자에서 자주 활용됨.", "note": "상환권: 투자원금 및 이자를 상환받을 수 있는 권리", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "스라시오 모델 (Thrasio Model)", "korean": "", "english": "", "description": "여러 이커머스 브랜드를 인수·통합·운영해 규모의 경제를 만드는 롤업(Brand Aggregator) 비즈니스 모델. Thrasio사가 대표 사례.=브랜드 애그리게이터, 롤업 비즈니스", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "스튜어드십 코드 (Stewardship Code)", "korean": "", "english": "", "description": "국민연금기금 의결권 행사 지침이란 연기금이 기업의 의사결정에 개입할 수 있도록 하는 제도를 의미\n기관투자자로서 국민연금이 가입자 재산을 제대로 관리하기 위해 투자기업 의사 결정에 적극적으로 개입하라는 취지", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "스펙상장 (SPAC Listing)", "korean": "", "english": "", "description": "기업공개(IPO)를 통해 자본을 모아서 주식시장에 먼저 상장 후, 비상장 주식회사중에서 유망한 기업을 합병하여 우회적으로 주식시장에 들어올 수 있게 하는 것", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "신주인수권부사채 (BW, Bond with Warrant)", "korean": "", "english": "", "description": "채권에 미리 정해진 가격으로 신주를 인수할 수 있는 권리(Warrant)가 붙은 상품.\n→ 투자자는 안정적인 이자 수익 + 주가 상승 시 추가 이익 기회를 동시에 얻을 수 있음.", "note": "전환사채(CB-주식으로 전환할 수 있는 권리가 붙은 사채)와 차이점:\n전환사채가 전환에 의해 그 사채가 소멸되는 데 비해 \n신주인수권부사채는 인수권의 행사에 의해 인수권 부분만 소멸", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "에그리게이터 (Aggregator)", "korean": "", "english": "", "description": "아마존으로 대표되는 마켓플레이스에 입점해있는 유망 브랜드를 발굴하여 인수하는 투자 기업들\n→ “스라시오(Thrasio)” 모델이 대표적. (브랜드 애그리게이터)", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "엘리엇 펀드 (=벌처 펀드, Elliott Fund / Vulture Fund)", "korean": "", "english": "", "description": "부실기업의 자산이나 채권을 저가에 매입해 기업을 정상화한 뒤 고가에 매각하는 투자 방식.\n→ “벌처(Vulture, 독수리)”는 부실 자산을 노린다는 의미에서 붙은 별칭.", "note": "e.g. 론스타: 미국의 부동산투자 전문 헤지 펀드", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "우회상장 (Backdoor Listing)", "korean": "", "english": "", "description": "비상장 기업이 상장 기업을 합병하거나 주식교환 등을 통해 간접적으로 증시에 상장하는 방식.\n→ 상장 요건은 부족하지만 성장성이 높은 기업의 자본조달 수단으로 활용됨.", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "의무공개매수제도 (Mandatory Tender Offer Rule)", "korean": "", "english": "", "description": "상장사의 지배권을 취득하려는 경우, 소액주주 보호를 위해 일정 지분 이상은 공개적으로 매수해야 하는 제도.\n이슈) 금융당국: 2023년 자본시장법 개정을 통해 의무공개매수제도 도입하겠다는 의사를 밝힘. \n'M&A 과정 중 소액주주들을 보호하기 위한 의무공개매수제도가 폐지 25년여 만에 재도입이 추진된다.\"", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "인적분할 (Spin-off / 人的分割)", "korean": "", "english": "", "description": "모회사의 일부 사업부를 분리해 새로운 자회사로 설립하고, 그 자회사 주식을 기존 주주가 동일 비율로 나눠 갖는 구조.", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "전환사채 (Convertible Bond)", "korean": "", "english": "", "description": "사채로서 발행되었지만 일정기간 경과 뒤 소유자의 청구에 의하여 주식으로 전환할 수 있는 사채", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "전환우선주 (CPS, Convertible Preferred Shares)", "korean": "", "english": "", "description": "우선주를 사전에 협의된 수량의 보통주로 전환할 수 있는 권리를 보유한 우선주\n일반 우선주에 비해서 배당률이 낮을 수 있지만, 보통주에 비해선 높으며 \n일반 우선주와 달리 배당 받지 못하게 될 시, 의결권 행사 특권 부여(보통주)되어 경영권 승계 방안에 활용되기도 함", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "주식매매계약 (SPA, Share Purchase Agreement)", "korean": "", "english": "", "description": "주식의 매매 조건과 절차를 명시한 계약서.\n→ M&A(인수합병) 시 지분 이전·대금 지급 조건·보증 조항 등을 규정함.", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "출자 (Equity Investment)", "korean": "", "english": "", "description": "다른 기업의 지분을 취득하거나 자본을 투입하는 행위.\n→ 신규 법인 설립, 계열사 확대, 전략적 파트너십 시 자주 활용됨.", "note": "순환출자: 동일 기업의 계열사간 출자를 하는 것을 일컫는 용어", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "캐피탈 콜 (Capital Call)", "korean": "", "english": "", "description": "투자자가 출자 약정을 체결한 뒤, 실제 투자 시점에 자금을 납입하도록 요청받는 절차.\n→ 펀드 운용사가 투자 시기에 맞춰 출자금을 단계적으로 호출함.", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "컴퍼니 빌딩 (Company Building)", "korean": "", "english": "", "description": "유망 아이템을 포착하면 단순 자금 지원이나 경영 지원 수준을 넘어 직접 사업에 뛰어드는 투자 모델\n→ 단순 투자에서 나아가 직접 사업화 및 성장 주도를 목표로 함.", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "터널링 (Tunneling)", "korean": "", "english": "", "description": "기업의 지하터널을 통해 기업을 자산을 뺴돌린다는 의미로, 소액주주의 부가 지배주주에게 이전되는 것 의미 (e.g. 라이크기획-SM)", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "포트폴리오 (Portfolio)", "korean": "", "english": "", "description": "① 펀드의 투자 대상 기업(Portfolio Company)\n② 개인 또는 기관의 자산 구성·투자 비중을 나타내는 조합.\n→ 위험 분산과 성과 최적화를 위한 기본 개념.", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "피봇팅(Pivoting)", "korean": "", "english": "", "description": "기존 사업 모델이나 방향을 시장 반응에 따라 전면 수정·전환하는 과정.\n→ 스타트업이 생존을 위해 핵심 가설을 바꾸는 전략적 방향 전환.", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "DD (Due Diligence)", "korean": "", "english": "", "description": "지분 혹은 자본구조에 있어서의 변화나 거래가 있는 기업에 대한 재무적·영업적 활동에 대해 조사하는 용역", "note": "LDD (Law Due Diligence): 법적 내용 실사 \nFDD (Financial Due Diligence): 재무 내용 실사", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "FI 투자자 (Financial Investor)", "korean": "", "english": "", "description": "재무적 투자자 (Financial Investor). M&A 거래에서 시너지 보다는 기업자체의 영업적, 재무적 변화를 통해 수익 창출 후 매각을 목표로 하는 인수자.\nFI투자자들은 투자로 인해 발생하는 기업의 미래 현금흐름과 투자금을 회수하기 위한 출구전략 (Exit)에 큰 관심이 있다.", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "IRR (Internal Rate of Return)", "korean": "", "english": "", "description": "프로젝트나 투자의 미래 현금흐름의 현재가치 합계가 투자금액과 같아지게 만드는 할인율.\n→ 투자수익률을 평가하는 핵심 지표.", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "LBO (Leveraged Buyout)", "korean": "", "english": "", "description": "사모 펀드회사들의 투자 방법 중 하나. 빚을 많이 이용하여 회사를 사들이는 투자 방법을 의미한다.\n부채를 이용한 기업인수 방식으로서 기업인수에 필요한 자금의 상당 부분을 피인수회사의 자산 혹은 장래의 현금흐름을 담보로 제공하거나 그 상당 부분을 피인수기업의 자산으로 변제하기로 하여 외부로부터의 차입금으로 충당하는 방식 등으로 피인수기업을 주로 개인기업화하는 기업인수기법을 뜻한다. \n지렛대효과를 통해 소수자본으로 큰 자본이득을 취할 수 있는 매우 효율적인 M&A 기법.", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "LOI (Letter of Intent)", "korean": "", "english": "", "description": "계약이 최종적으로 이루어지기 전에 두 당사자 이상이 협약의 대략적인 사항을 문서화하는 것으로, 합병 등의 과정에서 다른 회사를 사거나 팔기 위한 과정에서 사용", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "LP (Limited Partner)", "korean": "", "english": "", "description": "개인, 기관투자자를 포함한 유한책임투자자. LP는 펀드에 자금을 출자하여 GP에게 운용을 맡기고, 그 대가로 GP에게 보수를 지급합니다.", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "MBO (경영자인수)", "korean": "", "english": "", "description": "기업을 매각할 때 해당 사업부나 회사 내 근무하고 있는 경영진과 임직원이 중심이 되어 기업의 전부 또는 일부 사업부/계열사를 인수하는 구조조정의 한 방법", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "MVP 모델 (Minimum Viable Product)", "korean": "", "english": "", "description": "최소 기능 제품.\n고객 반응을 빠르게 확인하기 위해 핵심 기능만 구현한 제품이나 서비스.\n→ “일단 만들어서 시장에서 피드백 받고 개선한다”는 린 스타트업(Lean Startup)의 핵심 개념.", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "PE (Private Equity)", "korean": "", "english": "", "description": "비공개로 운영되는 사모투자.\n미래 성장 가능성과 시너지가 있는 회사를 발굴해 경영권 행사 및 가치 증대를 목적으로 투자.", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "Peer Group (비교기업군)", "korean": "", "english": "", "description": "유사한 산업·규모·시장특성을 가진 기업군.\n→ 기업가치 평가(Valuation) 시 비교 대상으로 사용됨.\n예: 모비데이즈의 Peer Group = 나스미디어", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "PEF / PE 투자 (Private Equity Fund)", "korean": "", "english": "", "description": "비상장 주식에 투자하는 사모펀드. 공개시장(증권거래소)이 아닌 곳에서 자본을 모아 기업 인수·구조조정·성장지원 등에 활용함.*사모/공모 여부는 중요하지 않음", "note": "참고자료", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "PER (Price to Earnings Ratio)", "korean": "", "english": "", "description": "시가총액 ÷ 영업이익으로 산출되는 주가수익비율.\n→ 현재 주가가 기업의 이익 대비 고평가 또는 저평가되어 있는지를 판단하는 지표.\n보통 PER 10을 기준으로 평가함.", "note": "PBR: 주가 / 주당순자산, 주가순자산비율로써 주당 기업의 순자산가치에 대한 주가의 비율", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "PMF (Product Market Fit)", "korean": "", "english": "", "description": "제품이 시장 수요와 정확히 맞아떨어지는 상태.\n→ 고객이 제품을 자발적으로 사용하고 재구매할 정도로 제품·시장 적합성이 확보된 단계.\n스타트업 성장의 핵심 지표 중 하나.", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "PMI (Post-Merger Integration)", "korean": "", "english": "", "description": "M&A 이후 진행되는 인수 후 통합 전략으로,\n인수·피인수 기업의 조직, 시스템, 문화, 프로세스 등을 하나로 융합하는 작업.\n→ 하드웨어(IT, 설비)뿐 아니라 조직문화·보상제도·지휘체계 등 소프트웨어적 통합까지 포함.", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "PSR (Price to Sales Ratio)", "korean": "", "english": "", "description": "시가총액 ÷ 매출액으로 계산되는 주가매출액비율.\n→ 1을 기준으로 평가하며, 1 이하일 경우 저평가된 주식일 가능성이 있음.", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "SI 투자자 (Strategic Investor)", "korean": "", "english": "", "description": "전략적 투자자 (Stretegic Investor). 현재 영위하는 사업과 관련된 다른 회사를 인수하여 시너지를 발생시키고 회사의 가치를 올리기 위해 기업을 인수하는 투자자.\n인수기업의 경쟁자, 공급 업체 또는 고객인 경우가 높다. SI투자자의 주된 목표는 피인수회사의 사업을 보유하는 것으로 기인수 회사의 기존 사업을 발전시키거나, 역으로 보유중인 사업을 통해 피인수기업의 역량을 강화하는 것.", "note": "", "priority": "권장"}, {"category": "🚀 스타트업/투자", "term": "Due Diligence", "korean": "", "english": "", "description": "거래상대방이 대상회사의 인수에 관계된 필요한 정보를 얻기 위해 대상회사의 경영상태, 자산상태, 재무적·영업적 활동 등 기업의 재무·운영상태를 검토하는 절차", "note": "", "priority": "권장"}, {"category": "📌 일반", "term": "알레고리 (Allegory)", "korean": "", "english": "", "description": "어떤 추상적 관념을 드러내기 위해 구체적인 사물에 비유하는 방식. → 예: ‘토끼와 거북이’는 근면과 성실의 알레고리(우화).", "note": "", "priority": "권장"}, {"category": "📌 일반", "term": "엑소더스 (Exodus)", "korean": "", "english": "", "description": "많은 사람들이 동시에 특정 장소를 떠나는 상황이나, 증시에서 투자금이 한꺼번에 빠져나가는 경우에 사용되는 표현이다.", "note": "", "priority": "권장"}, {"category": "📌 일반", "term": "폭포효과 (Cascade Effect)", "korean": "", "english": "", "description": "폭포에서 물이 떨어지고 그 물이 다시 떨어져 내리고 또 흐르듯이 연쇄적으로 어떤 일이 또 다른 일에 영향을 주는 상황.\n여러가지 원인이 복합적으로, 또 하나가 더해지고 또 하나가 더해지는 상황/ 도미노 효과와 유사한 개념.", "note": "", "priority": "권장"}, {"category": "📌 일반", "term": "풍선효과 (Balloon Effect)", "korean": "", "english": "", "description": "어떤 부분에서 문제를 해결하면 또 다른 부분에서 새로운 문제가 발생되는 현상을 가리키는 말. 사회적으로 문제가 되는 특정 사안을 규제 등의 조치를 통해 억압하거나 금지하면 규제 조치가 통하지 않는 또 다른 경로로 우회하여 유사한 문제를 일으키는 사회적 현상.", "note": "", "priority": "권장"}, {"category": "📌 일반", "term": "PA (Physician Assistant)", "korean": "", "english": "", "description": "의사의 책임 아래 일부 위임받아 진료보조를 수행하는 간호사, 음급구조사, 물리치료사 등을 지칭. 병원의 부족한 인력을 충원하기 위한 것으로, 일반적인 잡무 뿐 아니라 의사의 수술 보조와 더불어 처방 업무까지도 담당함. 의사의 지시 없이 진행하는 의료행위는 불법이므로 문제가 될 수 있음.", "note": "", "priority": "권장"}, {"category": "📌 일반", "term": "C레벨", "korean": "", "english": "", "description": "C로 시작하는 직급. 각 부문별 최고책임자(Chief XX Officer). 보통 임원을 뜻함.", "note": "", "priority": "필수"}, {"category": "📌 일반", "term": "CBO", "korean": "", "english": "", "description": "Chief Brand Officer. 최고브랜드책임자. 브랜드 전략을 경영 차원에서 총괄.", "note": "", "priority": "필수"}, {"category": "📌 일반", "term": "CCO", "korean": "", "english": "", "description": "Chief Communication Officer 또는 Chief Customer Officer. 홍보 또는 고객 서비스를 총괄.", "note": "", "priority": "필수"}, {"category": "📌 일반", "term": "CEO", "korean": "", "english": "", "description": "Chief Executive Officer. 최고경영자. 기업 전반을 총괄하는 가장 높은 경영 책임자.", "note": "", "priority": "필수"}, {"category": "📌 일반", "term": "CFO", "korean": "", "english": "", "description": "Chief Finance Officer. 재무 최고책임자. 회계·자금·예산 등 재무 전반을 총괄.", "note": "", "priority": "필수"}, {"category": "📌 일반", "term": "CHO", "korean": "", "english": "", "description": "Chief Human Resource Officer. 최고인사책임자. 인사 전반의 권한을 가진 책임자.", "note": "", "priority": "필수"}, {"category": "📌 일반", "term": "CIO", "korean": "", "english": "", "description": "Chief Investment Officer. 최고투자책임자. 투자 포트폴리오 관리 및 의사결정 담당.", "note": "", "priority": "필수"}, {"category": "📌 일반", "term": "CMO", "korean": "", "english": "", "description": "Chief Marketing Officer. 최고마케팅책임자. 마케팅 전략·조직 전반을 총괄.", "note": "", "priority": "필수"}, {"category": "📌 일반", "term": "COO", "korean": "", "english": "", "description": "Chief Operating Officer. 최고운영책임자. 일상 사업 운영을 총괄하는 의사결정자.", "note": "", "priority": "필수"}, {"category": "📌 일반", "term": "CSO", "korean": "", "english": "", "description": "Chief Strategy Officer. 최고전략책임자. 기업 전략 수립 및 실행을 담당. CEO 의사결정 지원.", "note": "", "priority": "필수"}, {"category": "📌 일반", "term": "CTO", "ko let activeCategory = 'all';
let searchQuery = '';
let priorityFilter = '';
let studyMode = 'flash';
let studyCats = [];
let studyPrio = '';
let studyDeck = [];
let fcIdx = 0;
let fcRevealed = false;
let qzIdx = 0;
let qzScore = 0;
let qzAnswered = false;

function switchTab(tab) {
  document.getElementById('browseTab').style.display = tab==='browse'?'block':'none';
  document.getElementById('studyTab').style.display = tab==='study'?'block':'none';
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(i===0&&tab==='browse')||(i===1&&tab==='study')));
}

const catCounts = {};
RAW.forEach(d=>{catCounts[d.category]=(catCounts[d.category]||0)+1});
const catOrder = ['🏢 내부 조직','📣 마케팅','💼 비즈니스','🚀 스타트업/투자','🏭 산업/기술','🚚 물류','🛒 커머스/무역','🎵 K-POP','📌 일반'];

function buildSidebar() {
  const ul = document.getElementById('catList');
  ul.innerHTML = '';
  const mk = (cat,label,count)=>{
    const li=document.createElement('li');
    li.innerHTML=`<button class="${activeCategory===cat?'active':''}" data-cat="${cat}"><span>${label}</span><span class="badge-count">${count}</span></button>`;
    li.querySelector('button').addEventListener('click',()=>{activeCategory=cat;buildSidebar();render();});
    ul.appendChild(li);
  };
  mk('all','전체',RAW.length);
  catOrder.forEach(c=>{if(catCounts[c])mk(c,c,catCounts[c]);});
}

function setPriority(p) {
  priorityFilter=p;
  const btns=document.querySelectorAll('.filter-row .filter-btn');
  btns.forEach(b=>b.className='filter-btn');
  if(p==='')btns[0].className='filter-btn active-all';
  else if(p==='필수')btns[1].className='filter-btn active-essential';
  else btns[2].className='filter-btn active-recommended';
  render();
}

function hl(text,q){
  if(!q||!text)return String(text||'');
  const e=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return String(text).replace(new RegExp(e,'gi'),m=>`<mark>${m}</mark>`);
}

function render() {
  let list=activeCategory==='all'?RAW:RAW.filter(d=>d.category===activeCategory);
  if(priorityFilter)list=list.filter(d=>d.priority===priorityFilter);
  if(searchQuery){
    const q=searchQuery.toLowerCase();
    list=list.filter(d=>d.term.toLowerCase().includes(q)||(d.description||'').toLowerCase().includes(q)||(d.english||'').toLowerCase().includes(q)||(d.korean||'').toLowerCase().includes(q));
  }
  const grid=document.getElementById('cardGrid');
  const empty=document.getElementById('emptyState');
  const stats=document.getElementById('stats');
  if(!list.length){grid.innerHTML='';empty.style.display='';stats.innerHTML='';return;}
  empty.style.display='none';
  stats.innerHTML=`<strong>${list.length}</strong>개 용어`;
  const q=searchQuery;
  grid.innerHTML=list.map(d=>{
    const pClass=d.priority==='필수'?'essential':'recommended';
    const pLabel=d.priority==='필수'?'⭐ 필수':'📚 권장';
    const sub=[
      d.korean?`<span class="sub-badge kr">${hl(d.korean,q)}</span>`:'',
      d.english?`<span class="sub-badge en">${hl(d.english,q)}</span>`:'',
    ].filter(Boolean).join('');
    return `<div class="card">
      <div class="card-top"><div class="term">${hl(d.term,q)}</div><span class="priority-badge ${pClass}">${pLabel}</span></div>
      ${sub?`<div class="sub-badges">${sub}</div>`:''}
      ${d.description?`<div class="desc">${hl(d.description,q)}</div>`:''}
      ${d.note&&d.note!='nan'&&d.note?`<div class="note-text">${d.note}</div>`:''}
    </div>`;
  }).join('');
}

document.getElementById('searchInput').addEventListener('input',e=>{
  searchQuery=e.target.value.trim();
  document.getElementById('clearBtn').style.display=searchQuery?'block':'none';
  render();
});
document.getElementById('clearBtn').addEventListener('click',()=>{
  document.getElementById('searchInput').value='';searchQuery='';
  document.getElementById('clearBtn').style.display='none';render();
});

function buildStudySetup(){
  const wrap=document.getElementById('catCheckboxes');
  wrap.innerHTML='';
  catOrder.forEach(c=>{
    if(!catCounts[c])return;
    const div=document.createElement('label');
    div.className='cat-check checked';
    div.innerHTML=`<input type="checkbox" value="${c}" checked><span>${c} (${catCounts[c]})</span>`;
    div.querySelector('input').addEventListener('change',()=>div.classList.toggle('checked',div.querySelector('input').checked));
    wrap.appendChild(div);
  });
}

function selectMode(m){
  studyMode=m;
  document.getElementById('modeFlash').classList.toggle('selected',m==='flash');
  document.getElementById('modeQuiz').classList.toggle('selected',m==='quiz');
}

function setStudyPrio(p){
  studyPrio=p;
  ['studyPrioAll','studyPrioEss','studyPrioRec'].forEach((id,i)=>{
    const el=document.getElementById(id);
    el.className='filter-btn'+(i===0&&p===''?' active-all':i===1&&p==='필수'?' active-essential':i===2&&p==='권장'?' active-recommended':'');
  });
}

function startStudy(){
  const checks=document.querySelectorAll('#catCheckboxes input:checked');
  studyCats=[...checks].map(c=>c.value);
  if(!studyCats.length){alert('카테고리를 하나 이상 선택해주세요.');return;}
  studyDeck=RAW.filter(d=>studyCats.includes(d.category)&&d.description);
  if(studyPrio)studyDeck=studyDeck.filter(d=>d.priority===studyPrio);
  studyDeck=studyDeck.sort(()=>Math.random()-.5);
  if(!studyDeck.length){alert('선택한 조건에 해당하는 용어가 없어요.');return;}
  document.getElementById('studySetup').style.display='none';
  if(studyMode==='flash')startFlashcard();
  else startQuiz();
}

function backToSetup(){
  document.getElementById('studySetup').style.display='block';
  document.getElementById('flashcardWrap').style.display='none';
  document.getElementById('quizWrap').style.display='none';
}

function restartStudy(){
  studyDeck=studyDeck.sort(()=>Math.random()-.5);
  if(studyMode==='flash')startFlashcard();
  else startQuiz();
}

// ── Flashcard (설명 → 용어 공개) ─────────────────────────────────────
function startFlashcard(){
  fcIdx=0;
  document.getElementById('flashcardWrap').style.display='block';
  document.getElementById('quizWrap').style.display='none';
  renderFlashcard();
}

function renderFlashcard(){
  const d=studyDeck[fcIdx];
  fcRevealed=false;
  document.getElementById('fcDesc').textContent=d.description||'(설명 없음)';
  // Hint: category only (don't reveal term-related hints)
  document.getElementById('fcHint').textContent=`카테고리: ${d.category}`;
  document.getElementById('fcRevealBtn').style.display='block';
  document.getElementById('fcAnswerBox').style.display='none';
  document.getElementById('fcTerm').textContent=d.term;
  document.getElementById('fcSub').textContent=[d.korean,d.english].filter(Boolean).join(' / ');
  document.getElementById('fcProgress').textContent=`${fcIdx+1} / ${studyDeck.length}`;
  document.getElementById('fcBar').style.width=((fcIdx+1)/studyDeck.length*100)+'%';
}

function revealTerm(){
  document.getElementById('fcRevealBtn').style.display='none';
  document.getElementById('fcAnswerBox').style.display='block';
  fcRevealed=true;
}

function fcMove(dir){
  fcIdx=Math.max(0,Math.min(studyDeck.length-1,fcIdx+dir));
  renderFlashcard();
}

// ── Quiz ──────────────────────────────────────────────────────────────
function startQuiz(){
  qzIdx=0;qzScore=0;qzAnswered=false;
  document.getElementById('quizWrap').style.display='block';
  document.getElementById('flashcardWrap').style.display='none';
  document.getElementById('quizScore').style.display='none';
  document.getElementById('quizCard').style.display='block';
  document.getElementById('qzBackBtn').style.display='block';
  renderQuiz();
}

function renderQuiz(){
  if(qzIdx>=studyDeck.length){showScore();return;}
  const d=studyDeck[qzIdx];
  qzAnswered=false;
  document.getElementById('qzDesc').textContent=d.description||'(설명 없음)';
  document.getElementById('qzInput').value='';
  document.getElementById('qzResult').style.display='none';
  document.getElementById('qzProgress').textContent=`${qzIdx+1} / ${studyDeck.length}  |  맞춘 것: ${qzScore}`;
  document.getElementById('qzBar').style.width=((qzIdx+1)/studyDeck.length*100)+'%';
  document.querySelector('.quiz-check-btn').textContent='정답 확인';
  setTimeout(()=>document.getElementById('qzInput').focus(),50);
}

function checkQuiz(){
  if(qzAnswered){qzIdx++;renderQuiz();return;}
  const d=studyDeck[qzIdx];
  const input=document.getElementById('qzInput').value.trim();
  const correct=d.term.toLowerCase().replace(/[\s\(\)·]/g,'');
  const given=input.toLowerCase().replace(/[\s\(\)·]/g,'');
  const res=document.getElementById('qzResult');
  res.style.display='block';
  if(given&&(correct.includes(given)||given.includes(correct)||correct===given)){
    res.className='quiz-result correct';
    res.textContent=`✅ 정답! "${d.term}"`;
    qzScore++;
  } else {
    res.className='quiz-result wrong';
    res.textContent=`❌ 오답. 정답은: ${d.term}`;
  }
  qzAnswered=true;
  document.querySelector('.quiz-check-btn').textContent='다음 →';
}

function showScore(){
  document.getElementById('quizCard').style.display='none';
  document.getElementById('qzBackBtn').style.display='none';
  const sc=document.getElementById('quizScore');
  sc.style.display='block';
  const pct=Math.round(qzScore/studyDeck.length*100);
  document.getElementById('scoreNum').textContent=`${qzScore} / ${studyDeck.length}`;
  document.getElementById('scoreSub').textContent=pct>=80?`🎉 ${pct}점! 완벽해요!`:pct>=60?`👍 ${pct}점! 잘 하고 있어요.`:`💪 ${pct}점. 한 번 더 도전해봐요!`;
}

// ── Init ──────────────────────────────────────────────────────────────
buildSidebar();
buildStudySetup();
render();
</script>
